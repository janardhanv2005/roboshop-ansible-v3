    - name: copy repo file
      copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo

    - name: install erlang rabbitmq-server
      dnf:
        name: 
          - erlang 
          - rabbitmq-server
        state: present

    - name: start and enable rabbitmq server
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Install boto3 and botocore via pip
      ansible.builtin.pip:
        name:
          - boto3
          - botocore
        state: present
        executable: pip3.9

    - name: create rabbitmq user
      community.rabbitmq.rabbitmq_user:
        user: roboshop
        password: roboshop123
        vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present